[nightlight]
enabled = true

[notification]
monitors = [ "DP-6" ]

[osd]
monitors = [ "DP-6" ]

    [osd.kinds]
    media = false
    privacy = false

[plugin_settings."noctalia/world_clock"]
panel_position = "center"

[plugin_settings."yuuto/arch-updater"]
aur_helper = "paru"
auto_check_hours = 24
hide_polkit_hint = true
panel_open_near_click = false
panel_placement = "floating"
show_activity_graph = true

[plugins]
enabled = [
    "noctalia/kaomoji",
    "noctalia/notes",
    "noctalia/timer",
    "noctalia/screen_recorder",
    "noctalia/translator",
    "noctalia/wallpaper_depth",
    "noctalia/world_clock",
    "yuuto/arch-updater",
    "reaperhound/ambient-sounds",
    "oldirtty/color_picker",
    "liamwh/emoji-picker",
    "fel/ocr",
    "radimous/prismlauncher-instances"
]

[shell]
clipboard_auto_paste = "off"
show_location = false

    [shell.launcher]
    app_grid = true
    categories = false
    compact = true

    [shell.panel]
    clipboard_position = "top_right"
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_session = true
    polkit_placement = "attached"
    session_placement = "floating"
    shadow = false
    wallpaper_placement = "floating"
    wallpaper_position = "top_left"

    [shell.screenshot]
    directory = "/home/livia/Pictures/Screenshots"

    [shell.session]
    grid_columns = 1

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Noctalia"
community_palette = "Rose Pine Moon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
directory = "/home/livia/Pictures/Wallpapers"
transition = [ "honeycomb" ]

    [wallpaper.default]
    path = "/home/livia/Pictures/Wallpapers/ilya-kuvshinov-img-8631.webp"

    [wallpaper.last]
    path = "/home/livia/Pictures/Wallpapers/Dropped Image (2).png"

    [wallpaper.monitors.DP-4]
    path = "/home/livia/Pictures/Wallpapers/Dropped Image (3).png"

    [wallpaper.monitors.DP-6]
    path = "/home/livia/Pictures/Wallpapers/Dropped Image (2).png"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/livia/Pictures/Wallpapers/Dropped Image.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/livia/Pictures/Wallpapers/ilya-kuvshinov-img-8631.webp"
    theme_mode = "auto"
    wallpaper_scheme = "faithful"

[widget.ambient-sounds]
type = "reaperhound/ambient-sounds:ambient-sounds"

[widget.audio_visualizer]
bands = 30
color_1 = "hover"
mirrored = false
show_when_idle = true
width = 50

[widget.bar]
type = "noctalia/wallpaper_depth:bar"

[widget.clock]
format = "{:%F %H:%M}"

[widget.media]
album_art_only = true

[widget.ocr]
type = "fel/ocr:ocr"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.widget]
type = "yuuto/arch-updater:widget"