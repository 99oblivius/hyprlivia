config_version = 14

[bar.default]
background_opacity = 0.669999985024333
center = [ "cpu", "ram", "network_rx", "network_tx" ]
concave_edge_corners = false
end = [ "widget", "tray", "clock" ]
hover_highlight = false
margin_ends = 0
radius = 0
shadow = false
start = [
    "session",
    "workspaces",
    "audio_visualizer",
    "brightness",
    "notifications",
    "volume",
    "input_volume",
    "bar",
    "recorder",
    "ambient-sounds",
    "ocr"
]
widget_spacing = 3

[control_center]
width = 750

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 1264.0
    box_width = 2384.0
    cx = 1280.0
    cy = 736.0
    output = "DP-6"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        background_color = "on_primary"
        background_opacity = 0.20999999999999999
        background_padding = 0
        background_radius = 21
        center_text = true
        clock_style = "digital"
        font_family = "Maple Mono NF CN ExtraLight"
        shadow = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 1440.0
    box_width = 2560.0
    cx = 1280.0
    cy = 720.0
    output = "DP-4"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false

[idle]
behavior_order = [ "lock", "lock-and-suspend", "screen-off" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 3600.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-6", "lockscreen-login-box@DP-4", "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
